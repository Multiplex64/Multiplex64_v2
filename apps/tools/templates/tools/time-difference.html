{% extends base_template %}
{% block title %}Time Difference Calculator - Multiplex64{% endblock %}
{% block content %}
<div class="_standard">
  <h2><a href="{% url 'tools:index' %}">Tools</a> / Time Difference Calculator</h2>
  <br>
  <br>
  Input
  <br>
  <input type="datetime-local" value="2026-01-01T00:00" id="input-before" oninput="getDateDiff();">
  to
  <input type="datetime-local" id="input-after" oninput="getDateDiff();">
  <br>
  <br>
  <button id="button-action">Go!</button>
  <input type="checkbox" id="check-auto" checked><label for="check-auto">Auto</label>
  <br>
  <br>
  Output
  <br>
  <div id="output"></div>
</div>
{% endblock %}

{% block script %}
<script>
  (function () {
    const inputBefore = document.getElementById("input-before")
    const inputAfter = document.getElementById("input-after")
    const checkAuto = document.getElementById('check-auto')
    const buttonAction = document.getElementById('button-action')
    const output = document.getElementById("output")
    function getDateDiff(manual_action) {
      if (manual_action || checkAuto.checked) {
        startDate = new Date(inputBefore.value)
        endDate = new Date(inputAfter.value)
        dateMS = endDate - startDate
        dateSec = dateMS / 1000
        dateMin = dateSec / 60
        dateHour = dateMin / 60
        dateDay = dateHour / 24
        dateWeek = dateDay / 7
        output.innerHTML = (
          // dateMS + " Milliseconds <br>" +
          dateSec + " Seconds <br>" +
          dateMin + " Minutes <br>" +
          dateHour + " Hours <br>" +
          dateDay + " Days <br>" +
          dateWeek + " Weeks"
        )
      }
    }
    var now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    inputAfter.value = now.toISOString().slice(0, 16);
    getDateDiff(true);
    inputBefore.addEventListener("change", () => getDateDiff())
    inputAfter.addEventListener("change", () => getDateDiff())
    buttonAction.addEventListener("click", () => getDateDiff(true))
  })();
</script>
{% endblock %}
