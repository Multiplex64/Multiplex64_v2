{% extends base_template %}
{% block title %}Text Repeater - Multiplex64{% endblock %}
{% block content %}
<div class="_standard">
  Text Repeater
  <br><br>
  Input
  <br>
  <textarea id="input-main">hello, world!</textarea>
  <br>
  Repetitions
  <br>
  <input id="repetitions" type="number" value="3">
  <br><br>
  <button id="button-action">Go!</button>
  <input type="checkbox" id="check-auto" checked><label for="check-auto">Auto</label>
  <br><br>
  Output
  <br>
  <textarea id="output"></textarea>
</div>
{% endblock %}

{% block script %}
<script>
  (function () {
    const inputMain = document.getElementById("input-main")
    const repetitions = document.getElementById("repetitions")
    const checkAuto = document.getElementById('check-auto')
    const buttonAction = document.getElementById('button-action')
    const output = document.getElementById("output")
    function repeat(manual_action) {
      if (manual_action || checkAuto.checked) {
        output.value = inputMain.value.repeat(repetitions.value)
      }
    }
    repeat(true);
    inputMain.addEventListener("input", () => repeat())
    repetitions.addEventListener("input", () => repeat())
    buttonAction.addEventListener("click", () => repeat(true))
  })();
</script>
{% endblock %}
