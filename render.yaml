databases:
  - name: multiplex64db
    plan: free
    databaseName: multiplex64
    user: multiplex64db_user

services:
  - type: web
    plan: free
    name: multiplex64
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn _config.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multiplex64db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4