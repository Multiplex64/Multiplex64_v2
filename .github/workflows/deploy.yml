name: Deploy to prod branch

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        cp dev/.env.example .env
        python manage.py test
        rm -f .env
    - name: Strip development files
      run: |
        dev/build.sh
        rm -rf dev/
    - name: Commit and push to prod branch
      run: |
        git checkout --orphan prod
        git add -A
        git commit -m "Production build from ${GITHUB_SHA}"
        # Force push to overwrite the old prod branch entirely
        git push -f origin prod